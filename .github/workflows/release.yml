name: Release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PDFCRAFT_BUILD_SHA: ${{ github.sha }}
jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v4
    - id: v
      name: Resolve version
      run: |
        . packaging/env.sh
        v=""
        v="${v:-$VERSION}"
        if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
          echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
          exit 1
        fi
        case "$v" in *-*) pre=true ;; *) pre=false ;; esac
        {
          echo "version=$v"
          echo "date=$(date -u +%Y-%m-%d)"
          echo "prerelease=$pre"
        } >>"$GITHUB_OUTPUT"
        echo "### PDF Avelton v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
  macos:
    name: macOS universal package
    needs:
    - version
    - macos-build
    runs-on: macos-15
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: storytold/craft-fonts
        ref: abb83316d96aa59c1cf64784289e378fe9fa5695
        path: craft-fonts
    - uses: actions/download-artifact@v4
      with:
        name: macos-slice-aarch64-apple-darwin
        path: target/aarch64-apple-darwin/release
    - uses: actions/download-artifact@v4
      with:
        name: macos-slice-x86_64-apple-darwin
        path: target/x86_64-apple-darwin/release
    - name: Restore executable permissions
      run: chmod +x target/*-apple-darwin/release/pdfcraft target/*-apple-darwin/release/pdfcraft-cli
    - name: Assemble and verify unsigned universal package
      run: bash packaging/macos/package.sh --skip-build --arch universal
    - uses: actions/upload-artifact@v4
      with:
        name: release-macos-universal
        path: dist/release/*
        if-no-files-found: error
  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          target: x86_64-pc-windows-msvc
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      CARGO_BUILD_JOBS: '2'
    steps:
    - uses: actions/checkout@v4
    - name: Check out craft-fonts
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: storytold/craft-fonts
        ref: abb83316d96aa59c1cf64784289e378fe9fa5695
        path: craft-fonts
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
      with:
        key: release-windows-${{ matrix.arch }}
        cache-on-failure: true
    - name: Install WiX
      shell: pwsh
      run: dotnet tool install --global wix --version 5.0.2
    - name: Build, sign, package
      shell: pwsh
      env:
        CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        CRAFT_FONTS_REQUIRED: '1'
      run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
    - name: Install and verify Avelton MSI
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $msi = Get-ChildItem dist/release/*.msi | Select-Object -First 1
        $process = Start-Process msiexec.exe -WindowStyle Hidden -Wait -PassThru -ArgumentList @('/i', ('"' + $msi.FullName + '"'), '/qn', '/norestart')
        if ($process.ExitCode -notin 0,3010) { throw "MSI installation failed: $($process.ExitCode)" }
        $installed = Join-Path $env:ProgramFiles 'PDF Avelton'
        if (-not (Test-Path -LiteralPath (Join-Path $installed 'pdf-avelton.exe'))) { throw 'installed GUI missing' }
        & (Join-Path $installed 'pdf-avelton-cli.exe') --version
        if ($LASTEXITCODE -ne 0) { throw 'installed CLI failed' }
    - uses: actions/upload-artifact@v4
      with:
        name: release-windows-${{ matrix.arch }}
        path: dist/release/*
        if-no-files-found: error
  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-22.04
          deb: amd64
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NFPM_VERSION: 2.47.0
      CARGO_BUILD_JOBS: '2'
    steps:
    - uses: actions/checkout@v4
    - name: Check out craft-fonts
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: storytold/craft-fonts
        ref: abb83316d96aa59c1cf64784289e378fe9fa5695
        path: craft-fonts
    - name: Install build and packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
          desktop-file-utils appstream python3-yaml zsync
        curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
          "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
        sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        key: release-linux-${{ matrix.arch }}
        cache-on-failure: true
    - name: Build and package (AppImage, deb, rpm, tar.gz, CLI tar.gz)
      env:
        CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        CRAFT_FONTS_REQUIRED: '1'
      run: packaging/linux/package.sh
    - name: Check the packages
      run: |
        dpkg-deb --info dist/release/*.deb
        dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/pdf-avelton$|metainfo|applications'
        # The OCR models (#103), where the installed app looks: <bin>/../share/pdfcraft/models.
        dpkg-deb --contents dist/release/*.deb | grep -E 'usr/share/pdfcraft/models/.+\.rten$'
        # Named exactly: dist/release also holds the CLI-only tar.gz, and `tar -tzf a b` reads b as a member.
        tar -tzf "dist/release/pdfcraft-$PDFCRAFT_VERSION-linux-${{ matrix.arch }}.tar.gz" | grep -E '/share/pdfcraft/models/.+\.rten$'
        ldd target/release/pdfcraft
        # The CLI-only archive: the binary and its licences, and it runs.
        cli="dist/release/pdfcraft-cli-$PDFCRAFT_VERSION-linux-${{ matrix.arch }}.tar.gz"
        tar -tzf "$cli" | grep -E '/pdfcraft-cli$'
        tar -tzf "$cli" | grep -E '/LICENSE-APACHE$'
        mkdir -p "$RUNNER_TEMP/cli" && tar -xzf "$cli" -C "$RUNNER_TEMP/cli"
        "$RUNNER_TEMP/cli/pdfcraft-cli-$PDFCRAFT_VERSION-linux-${{ matrix.arch }}/pdfcraft-cli" --version
        python3 -c "import yaml; m = yaml.safe_load(open('packaging/linux/flatpak/online.avelton.pdf.yml')); assert m['id'] == 'online.avelton.pdf'"
        for appimage in dist/release/*.AppImage; do
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          # Update information is embedded, and the .zsync for delta updates sits beside it.
          "$appimage" --appimage-updateinformation | grep -F 'gh-releases-zsync|'
          test -s "$appimage.zsync"
        done
    - uses: actions/upload-artifact@v4
      with:
        name: release-linux-${{ matrix.arch }}
        path: dist/release/*
        if-no-files-found: error
  web:
    name: Web (wasm)
    needs: version
    runs-on: ubuntu-latest
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      TRUNK_VERSION: 0.21.14
    steps:
    - uses: actions/checkout@v4
    - name: Check out craft-fonts
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: storytold/craft-fonts
        ref: abb83316d96aa59c1cf64784289e378fe9fa5695
        path: craft-fonts
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        key: release-web
        cache-on-failure: true
    - name: Install trunk
      run: |
        curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C "$HOME/.cargo/bin" trunk
        trunk --version
    - name: Build and zip
      env:
        CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        CRAFT_FONTS_REQUIRED: '1'
      run: packaging/web/package.sh
    - uses: actions/upload-artifact@v4
      with:
        name: release-web
        path: dist/release/*
        if-no-files-found: error
    - name: Install browser verification tools
      run: |-
        python3 -m pip install --disable-pip-version-check pillow playwright==1.63.0
        python3 -m playwright install --with-deps chromium
    - name: Verify actual browser bundle
      run: xvfb-run -a python3 scripts/avelton-web-smoke.py dist/release/pdf-avelton-web-*.zip
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: verification-web
        path: target/avelton-smoke/
        if-no-files-found: warn
  release:
    name: Draft GitHub Release
    needs:
    - version
    - quality
    - macos
    - windows
    - linux
    - web
    - packaging
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: artifacts
        merge-multiple: true
    - name: Checksums
      working-directory: artifacts
      run: |
        sha256sum -- * | tee SHA256SUMS.txt
    - name: Create or update the draft release
      working-directory: artifacts
      run: |
        tag="v$VERSION"
        title="PDF Avelton v$VERSION"
        pre=()
        if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
        if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
          if [ "$draft" != "true" ]; then
            echo "::error::Release $tag is already published. Bump the version (cargo xtask version set) before pushing to release."
            exit 1
          fi
          echo "Updating draft $tag: replacing its assets"
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset "$tag" "$asset" --yes
          done
          gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
          gh release upload "$tag" --clobber -- *
        else
          echo "Creating draft $tag"
          gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${pre[@]}" -- *
        fi
        {
          echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
          echo
          sed 's/^/    /' SHA256SUMS.txt
        } >>"$GITHUB_STEP_SUMMARY"
  macos-build:
    name: macOS ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          target: aarch64-apple-darwin
        - runner: macos-15-intel
          target: x86_64-apple-darwin
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_BUILD_JOBS: '2'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: storytold/craft-fonts
        ref: abb83316d96aa59c1cf64784289e378fe9fa5695
        path: craft-fonts
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
      with:
        key: release-macos-${{ matrix.target }}
        cache-on-failure: true
    - name: Build native slice
      run: cargo build --release --locked -p pdfcraft -p pdfcraft-cli --target "${{ matrix.target }}"
    - uses: actions/upload-artifact@v4
      with:
        name: macos-slice-${{ matrix.target }}
        path: |-
          target/${{ matrix.target }}/release/pdfcraft
          target/${{ matrix.target }}/release/pdfcraft-cli
        if-no-files-found: error
  quality:
    uses: ./.github/workflows/ci.yml
  packaging:
    uses: ./.github/workflows/packaging-lint.yml
